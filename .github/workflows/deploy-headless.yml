# headless/ Next.js を Vercel 本番（escomi-headless）へデプロイ
# Secrets: VERCEL_TOKEN
# Variables または Secrets: VERCEL_ORG_ID, VERCEL_PROJECT_ID
# 本番 DNS 切替（mens-esthe-kuchikomi.com → Vercel）は手動。本 workflow は Vercel へのデプロイのみ。

name: Deploy Headless to Vercel

on:
  push:
    branches:
      - main
    paths:
      - 'headless/**'
      - '.github/workflows/deploy-headless.yml'
  workflow_dispatch:
    inputs:
      preflight_only:
        description: 'Read-only WordPress origin probe; skip the deployment job'
        type: boolean
        default: false

defaults:
  run:
    working-directory: headless

jobs:
  origin-probe:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.preflight_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read-only critical WordPress origin probe
        run: node scripts/wp-critical-build-preflight.mjs

  deploy:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.preflight_only }}
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Vercel credentials
        env:
          VERCEL_ORG_ID_VAR: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_ORG_ID_SECRET: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID_VAR: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_PROJECT_ID_SECRET: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN が未設定です（Repository secrets に Vercel トークンを登録してください）。"
            exit 1
          fi

          if [ -n "$VERCEL_ORG_ID_VAR" ]; then
            echo "VERCEL_ORG_ID=$VERCEL_ORG_ID_VAR" >> "$GITHUB_ENV"
          elif [ -n "$VERCEL_ORG_ID_SECRET" ]; then
            echo "VERCEL_ORG_ID=$VERCEL_ORG_ID_SECRET" >> "$GITHUB_ENV"
          else
            echo "::error::VERCEL_ORG_ID が未設定です（Repository variables または secrets に team ID を登録してください）。"
            exit 1
          fi

          if [ -n "$VERCEL_PROJECT_ID_VAR" ]; then
            echo "VERCEL_PROJECT_ID=$VERCEL_PROJECT_ID_VAR" >> "$GITHUB_ENV"
          elif [ -n "$VERCEL_PROJECT_ID_SECRET" ]; then
            echo "VERCEL_PROJECT_ID=$VERCEL_PROJECT_ID_SECRET" >> "$GITHUB_ENV"
          else
            echo "::error::VERCEL_PROJECT_ID が未設定です（Repository variables または secrets に project ID を登録してください）。"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: headless/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Install Vercel CLI
        run: npm install --global vercel@54.13.0

      - name: Link Vercel project
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Sync Vercel env for contact check
        run: |
          if [ -f .vercel/.env.production.local ]; then
            cp .vercel/.env.production.local .env.local
            echo "Vercel 本番 env を .env.local に同期しました（.gitignore 対象・リポジトリには含めません）。"
          elif [ -f .env.local ] || [ -f .env ]; then
            echo "既存の .env.local または .env を contact:check-env で使用します。"
          else
            echo "::error::SMTP チェック用の env ファイルがありません。vercel pull 後の .vercel/.env.production.local、または headless/.env / .env.local のいずれかが必要です。Vercel 本番に SMTP 環境変数が登録されているか確認してください。"
            exit 1
          fi

      - name: Critical WordPress build preflight
        run: npm run wp:critical-preflight

      - name: Build (CI validation)
        run: npm run build

      - name: Verify critical Area validation artifacts
        run: npm run verify:critical-area-build-artifacts

      - name: Check contact form environment
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          CONTACT_FROM_EMAIL: ${{ secrets.CONTACT_FROM_EMAIL }}
          CONTACT_TO_EMAIL: ${{ secrets.CONTACT_TO_EMAIL }}
          CONTACT_FORM_DRY_RUN: ${{ secrets.CONTACT_FORM_DRY_RUN }}
        run: npm run contact:check-env

      - name: Vercel build (prebuilt)
        run: vercel build --prod --yes --token="$VERCEL_TOKEN"

      - name: Verify critical Area build artifacts
        run: npm run verify:critical-area-build-artifacts -- --vercel

      - name: Create staged Vercel production deployment
        id: deploy
        run: |
          set -euo pipefail

          DEPLOYMENT_URL=$(vercel deploy \
            --prebuilt \
            --prod \
            --skip-domain \
            --yes \
            --archive=tgz \
            --meta eskomiGitSha="$GITHUB_SHA")
          DEPLOYMENT_URL=$(printf '%s\n' "$DEPLOYMENT_URL" | grep -oE 'https://[^[:space:]]+\.vercel\.app' | tail -1 || true)
          if [ -z "$DEPLOYMENT_URL" ] || [[ "$DEPLOYMENT_URL" != https://*.vercel.app ]]; then
            echo "::error::Exact Vercel deployment URLを取得できませんでした。"
            exit 1
          fi

          INSPECT_JSON=$(vercel inspect "$DEPLOYMENT_URL" --format=json)
          DEPLOYMENT_ID=$(printf '%s' "$INSPECT_JSON" | node -e '
            let source = "";
            process.stdin.on("data", (chunk) => { source += chunk; });
            process.stdin.on("end", () => {
              const value = JSON.parse(source);
              if (!value.id) process.exit(1);
              process.stdout.write(value.id);
            });
          ')
          if [[ ! "$DEPLOYMENT_ID" =~ ^dpl_[A-Za-z0-9]+$ ]]; then
            echo "::error::Exact Vercel deployment IDを取得できませんでした。"
            exit 1
          fi

          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "::notice::Staged Vercel deployment: $DEPLOYMENT_ID ($DEPLOYMENT_URL)"

      - name: Verify exact staged deployment
        id: exact_qa
        env:
          EXACT_DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          EXACT_DEPLOYMENT_ID: ${{ steps.deploy.outputs.id }}
          EXPECTED_GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          QA_RESULT=$(npm run --silent qa:exact-deployment-release -- \
            --url "$EXACT_DEPLOYMENT_URL" \
            --id "$EXACT_DEPLOYMENT_ID" \
            --expected-sha "$EXPECTED_GIT_SHA")
          printf '%s\n' "$QA_RESULT"
          VERIFIED_SHA=$(printf '%s' "$QA_RESULT" | node -e '
            let source = "";
            process.stdin.on("data", (chunk) => { source += chunk; });
            process.stdin.on("end", () => {
              const value = JSON.parse(source);
              if (value.status !== "PASS" || value.exactQa !== "PASS" || value.promotionStatus !== "NOT_PROMOTED") process.exit(1);
              process.stdout.write(value.verifiedSha);
            });
          ')
          test "$VERIFIED_SHA" = "$EXPECTED_GIT_SHA"
          echo "verified-sha=$VERIFIED_SHA" >> "$GITHUB_OUTPUT"

      - name: Legacy public-domain auxiliary SEO check
        if: ${{ vars.HEADLESS_CI_CHECK_URL != '' }}
        env:
          HEADLESS_CI_CHECK_URL: ${{ vars.HEADLESS_CI_CHECK_URL }}
        run: |
          echo "Auxiliary public-domain SEO check: $HEADLESS_CI_CHECK_URL"
          npm run seo:cutover-check -- "$HEADLESS_CI_CHECK_URL"

      - name: Record staged release gate result
        env:
          EXACT_DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          EXACT_DEPLOYMENT_ID: ${{ steps.deploy.outputs.id }}
          EXPECTED_GIT_SHA: ${{ github.sha }}
          VERIFIED_GIT_SHA: ${{ steps.exact_qa.outputs.verified-sha }}
        run: |
          PROMOTION_STATUS=NOT_PROMOTED
          {
            echo "## Exact staged deployment release gate"
            echo "### PRE_PROMOTION"
            echo "- deployment ID: $EXACT_DEPLOYMENT_ID"
            echo "- deployment URL: $EXACT_DEPLOYMENT_URL"
            echo "- expected Git SHA: $EXPECTED_GIT_SHA"
            echo "- verified deployment SHA: $VERIFIED_GIT_SHA"
            echo "- exact QA: PASS"
            echo "- promotion: $PROMOTION_STATUS"
            echo "- next action: USER_APPROVAL_REQUIRED"
            echo "### POST_PROMOTION REQUIRED"
            echo "- custom domain HTTP 200"
            echo "- X-Robots-Tag noindex absent"
            echo "- HTML robots noindex absent"
            echo "- shinosaka shop cards / ItemList: 58 / 58"
            echo "- sakai shop cards / ItemList: 25 / 25"
            echo "- canonical and BreadcrumbList / ItemList / FAQPage valid"
            echo "- JavaScript-enabled browser QA PASS"
            echo "- no-JS supporting completeness: 100%"
            echo "### POST_PROMOTION FAILURE"
            echo "- RELEASE_CLOSED = NO"
            echo "- next action: ROLLBACK_DECISION_REQUIRED"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "PROMOTION_STATUS=$PROMOTION_STATUS"
