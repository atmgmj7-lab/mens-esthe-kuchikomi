name: Daily Shop Update

on:
  schedule:
    # 日本時間 毎朝 6:00（UTC 21:00 前日）
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      max_shops:
        description: '手動時のみ効く最大件数。1 を推奨（パイロット）。空欄なら cron と同じく全店舗。'
        required: false
        type: string
        default: ''

jobs:
  update-shops:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # workflow_dispatch のときのみ inputs を参照し、schedule では短絡評価で読まないこと
      MAX_SHOPS_MANUAL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.max_shops || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('ai-site-monitor/requirements.txt') }}

      - name: Install dependencies
        run: |
          cd ai-site-monitor
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          cd ai-site-monitor
          python -m playwright install chromium --with-deps

      - name: Cache SQLite database
        uses: actions/cache@v4
        with:
          path: ai-site-monitor/escomi_crawler.db
          key: ${{ runner.os }}-escomi-db-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-escomi-db-

      - name: Backup sites.json
        run: |
          cd ai-site-monitor
          cp sites.json sites.json.bak

      - name: Pre-flight REST check
        env:
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
        run: |
          HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
            -X POST "${WP_SITE_URL}/wp-json/escomi/v1/update" \
            -H "Content-Type: application/json" \
            --max-time 15)
          echo "::notice::REST health check: POST /wp-json/escomi/v1/update → HTTP ${HTTP_CODE}"
          if [ "$HTTP_CODE" = "404" ]; then
            echo "::error::escomi/v1/update が 404 (rest_no_route) — WordPress 側でルートが未登録です。"
            echo "考えられる原因:"
            echo "  1. ai-update-log.php が子テーマにデプロイされていない（deploy.yml の FTP_PATH を確認）"
            echo "  2. functions.php が ai-update-log.php を require_once できていない（PHP Fatal の可能性）"
            echo "  3. WP 管理画面 → 設定 → パーマリンク → 保存 でリライトルールの再生成が必要"
            exit 1
          fi
          if [ "$HTTP_CODE" = "000" ]; then
            echo "::error::WP_SITE_URL への接続に失敗しました（curl exit 000）。URL / WAF / Secret 設定を確認してください。"
            exit 1
          fi
          echo "REST ルート確認 OK（HTTP ${HTTP_CODE} — 401 は認証なし正常）"

      - name: Run ai_auto_updater
        env:
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SHOP_DELAY_SECONDS: '3'
          AREA_TERM_ID: '7'
        run: |
          cd ai-site-monitor
          if [ -n "${MAX_SHOPS_MANUAL}" ]; then
            echo "::notice::Manual run: --limit ${MAX_SHOPS_MANUAL}"
            python ai_auto_updater.py --limit "${MAX_SHOPS_MANUAL}"
          else
            echo "::notice::Full run (--all)"
            python ai_auto_updater.py --all
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-results-${{ github.run_id }}
          path: ai-site-monitor/results/
          retention-days: 7
          if-no-files-found: warn
