name: Daily Shop Update

on:
  schedule:
    # 日本時間 毎朝 6:00（UTC 21:00 前日）
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      max_shops:
        description: '手動時のみ効く最大件数。1 を推奨（パイロット）。空欄なら cron と同じく全店舗。'
        required: false
        type: string
        default: ''

jobs:
  update-shops:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # workflow_dispatch のときのみ inputs を参照し、schedule では短絡評価で読まないこと
      MAX_SHOPS_MANUAL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.max_shops || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('ai-site-monitor/requirements.txt') }}

      - name: Install dependencies
        run: |
          cd ai-site-monitor
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          cd ai-site-monitor
          python -m playwright install chromium --with-deps

      - name: Cache SQLite database
        uses: actions/cache@v4
        with:
          path: ai-site-monitor/escomi_crawler.db
          key: ${{ runner.os }}-escomi-db-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-escomi-db-

      - name: Backup sites.json
        run: |
          cd ai-site-monitor
          cp sites.json sites.json.bak

      - name: Debug - Check IP and country
        continue-on-error: true
        run: |
          echo "GitHub Actions の送信元IP:"
          curl -s https://api.ipify.org || echo "ipify 失敗"
          echo ""
          echo "国情報:"
          curl -s https://ipapi.co/json/ | grep -E '"ip"|"country_name"|"country_code"' || echo "ipapi 失敗"

      - name: Pre-flight REST check
        env:
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
          DAILY_UPDATE_PROXY_SECRET: ${{ secrets.DAILY_UPDATE_PROXY_SECRET }}
        run: |
          set -euo pipefail
          WP_SITE_URL="${WP_SITE_URL%/}"
          REST_UPDATE_URL="${WP_SITE_URL}/wp-json/escomi/v1/update/"
          UNAUTH_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
            -X POST "${REST_UPDATE_URL}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            --max-time 15)
          if [ "$UNAUTH_CODE" != "401" ]; then
            echo "::error::専用秘密鍵なしのPOSTは401で拒否される必要があります。HTTP ${UNAUTH_CODE}"
            exit 1
          fi

          AUTH_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
            -X POST "${REST_UPDATE_URL}" \
            -H "Content-Type: application/json" \
            -H "x-escomi-daily-update-secret: ${DAILY_UPDATE_PROXY_SECRET}" \
            -d '{}' \
            --max-time 15)
          if [ "$AUTH_CODE" != "400" ]; then
            echo "::error::秘密鍵付き空payloadはWordPress検証で400になる必要があります。HTTP ${AUTH_CODE}"
            exit 1
          fi
          echo "::notice::日次更新bridgeの401/400 preflightに成功しました。"

      - name: Run ai_auto_updater
        env:
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
          DAILY_UPDATE_PROXY_SECRET: ${{ secrets.DAILY_UPDATE_PROXY_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SHOP_DELAY_SECONDS: '3'
          AREA_TERM_ID: '7'
        run: |
          cd ai-site-monitor
          if [ -n "${MAX_SHOPS_MANUAL}" ]; then
            echo "::notice::Manual run: --limit ${MAX_SHOPS_MANUAL}"
            python ai_auto_updater.py --limit "${MAX_SHOPS_MANUAL}"
          else
            echo "::notice::Full run (--all)"
            python ai_auto_updater.py --all
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-results-${{ github.run_id }}
          path: ai-site-monitor/results/
          retention-days: 7
          if-no-files-found: warn
