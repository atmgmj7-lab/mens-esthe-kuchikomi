# swell_child テーマを Xserver（本番）へ FTP デプロイ
# Secrets: FTP_HOST, FTP_USERNAME, FTP_PASSWORD, FTP_PATH
# FTP-Deploy-Action の仕様上、FTP_PATH（server-dir）は末尾スラッシュ付きで登録すること（例: .../themes/swell_child/）

name: Deploy to Xserver

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate FTP secrets
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
        run: |
          if [ -z "$FTP_HOST" ]; then
            echo "::error::FTP_HOST が未設定です（Repository secrets に FTP サーバー名を登録してください）。"
            exit 1
          fi
          if [ -z "$FTP_USERNAME" ]; then
            echo "::error::FTP_USERNAME が未設定です。"
            exit 1
          fi
          if [ -z "$FTP_PASSWORD" ]; then
            echo "::error::FTP_PASSWORD が未設定です。"
            exit 1
          fi
          if [ -z "$FTP_PATH" ]; then
            echo "::error::FTP_PATH が未設定です。"
            exit 1
          fi
          case "$FTP_PATH" in
            */) ;;
            *)
              echo "::warning::FTP_PATH の末尾にスラッシュが無いです。SamKirkland/FTP-Deploy-Action は server-dir の末尾スラッシュを推奨します。"
              ;;
          esac

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: ${{ secrets.FTP_PATH }}
          # 初回疎通確認: 実転送なし（本番転送に戻すときは false にするか行ごと削除）
          dry-run: true
          exclude: |
            **/.git/**
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/venv/**
            **/__pycache__/**
            **/.pytest_cache/**
            **/.DS_Store
            **/.idea/**
            **/.vscode/**
            .github/**
            docs/**
            pm/**
            tools/**
            ai-site-monitor/**
            content/**
            **/*.md
            **/*.markdown
            **/*.MD
            **/*.log
            import-test.php
            import-shops-web.php
            extract_target_list.py
            requirements-extract.txt
            requirements-extract*.txt
            shops.csv
            wp_shops.example.json
            .cursorrules
            .cursor/**
            **/.env
            **/.env.*
            **/*.secret
            **/*.pem
