# swell_child テーマを Xserver（本番）へ FTP デプロイ
# Secrets: FTP_HOST, FTP_USERNAME, FTP_PASSWORD, FTP_PATH
# FTP-Deploy-Action の仕様上、FTP_PATH（server-dir）は末尾スラッシュ付きで登録すること（例: .../themes/swell_child/）

name: Deploy to Xserver

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate FTP secrets
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
        run: |
          if [ -z "$FTP_HOST" ]; then
            echo "::error::FTP_HOST が未設定です（Repository secrets に FTP サーバー名を登録してください）。"
            exit 1
          fi
          if [ -z "$FTP_USERNAME" ]; then
            echo "::error::FTP_USERNAME が未設定です。"
            exit 1
          fi
          if [ -z "$FTP_PASSWORD" ]; then
            echo "::error::FTP_PASSWORD が未設定です。"
            exit 1
          fi
          if [ -z "$FTP_PATH" ]; then
            echo "::error::FTP_PATH が未設定です。"
            exit 1
          fi
          case "$FTP_PATH" in
            */) ;;
            *)
              echo "::warning::FTP_PATH の末尾にスラッシュが無いです。SamKirkland/FTP-Deploy-Action は server-dir の末尾スラッシュを推奨します。"
              ;;
          esac

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./
          server-dir: ${{ secrets.FTP_PATH }}
          timeout: 30000
          log-level: verbose
          dangerous-clean-slate: true
          # 初回疎通確認: 実転送なし（必要時のみコメント解除）
          # dry-run: true
          exclude: |
            **/.git/**
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/venv/**
            **/__pycache__/**
            **/.pytest_cache/**
            **/.DS_Store
            **/.idea/**
            **/.vscode/**
            .github/**
            docs/**
            pm/**
            tools/**
            ai-site-monitor/**
            content/**
            **/*.md
            **/*.markdown
            **/*.MD
            **/*.log
            import-test.php
            import-shops-web.php
            extract_target_list.py
            requirements-extract.txt
            requirements-extract*.txt
            shops.csv
            wp_shops.example.json
            .cursorrules
            .cursor/**
            **/.env
            **/.env.*
            **/*.secret
            **/*.pem

      - name: Clear OPcache
        env:
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
        run: |
          sleep 10
          RESULT=$(curl -sS "${WP_SITE_URL}/wp-json/escomi/v1/debug" --max-time 15 2>/dev/null || echo '{}')
          echo "OPcache clear: $(echo $RESULT | grep -o '"opcache_reset":[^,}]*' || echo 'n/a')"

      - name: Post-deploy REST check
        env:
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
        run: |
          sleep 5
          HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
            -X POST "${WP_SITE_URL}/wp-json/escomi/v1/update" \
            -H "Content-Type: application/json" \
            --max-time 20)
          echo "::notice::デプロイ後 REST check: POST /wp-json/escomi/v1/update → HTTP ${HTTP_CODE}"
          if [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
            echo "REST ルート確認 OK（HTTP ${HTTP_CODE}）— escomi/v1/update は正常に登録されています"
          elif [ "$HTTP_CODE" = "404" ]; then
            echo "::warning::デプロイ後も escomi/v1/update が 404 のままです。"
            echo "  確認事項:"
            echo "  1. FTP_PATH が wp-content/themes/swell_child/ を指しているか"
            echo "  2. WordPress 管理画面 → 設定 → パーマリンク → 保存 を実行してください"
          else
            echo "::notice::REST check: HTTP ${HTTP_CODE}（403/503 等はサーバー/WAF の設定を確認）"
          fi
