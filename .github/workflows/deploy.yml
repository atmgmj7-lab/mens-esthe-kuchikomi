# swell_child テーマを Xserver（本番）へ FTP デプロイ
# Secrets: FTP_HOST, FTP_USERNAME, FTP_PASSWORD, FTP_PATH
# FTP-Deploy-Action の仕様上、FTP_PATH（server-dir）は末尾スラッシュ付きで登録すること（例: .../themes/swell_child/）

name: Deploy to Xserver

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'headless/**'
      - 'pm/**'
      - 'docs/**'
      - 'tools/**'
      - 'ai-site-monitor/**'
      - 'content/**'
      - '*.md'
      - '.DS_Store'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate FTP secrets
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
        run: |
          if [ -z "$FTP_HOST" ]; then
            echo "::error::FTP_HOST が未設定です（Repository secrets に FTP サーバー名を登録してください）。"
            exit 1
          fi
          if [ -z "$FTP_USERNAME" ]; then
            echo "::error::FTP_USERNAME が未設定です。"
            exit 1
          fi
          if [ -z "$FTP_PASSWORD" ]; then
            echo "::error::FTP_PASSWORD が未設定です。"
            exit 1
          fi
          if [ -z "$FTP_PATH" ]; then
            echo "::error::FTP_PATH が未設定です。"
            exit 1
          fi
          case "$FTP_PATH" in
            */) ;;
            *)
              echo "::warning::FTP_PATH の末尾にスラッシュが無いです。SamKirkland/FTP-Deploy-Action は server-dir の末尾スラッシュを推奨します。"
              ;;
          esac

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Build Dashboard
        run: |
          cd dashboard
          npm ci
          npm run build
          cp -r out/. .
          rm -rf out

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./
          server-dir: ${{ secrets.FTP_PATH }}
          timeout: 30000
          log-level: verbose
          dangerous-clean-slate: false
          # 初回疎通確認: 実転送なし（必要時のみコメント解除）
          # dry-run: true
          exclude: |
            **/.git/**
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/venv/**
            **/__pycache__/**
            **/.pytest_cache/**
            **/.DS_Store
            **/.idea/**
            **/.vscode/**
            .github/**
            docs/**
            headless/**
            pm/**
            tools/**
            ai-site-monitor/**
            content/**
            agent-foundation/**
            MensEsthe-Notes/**
            **/*.md
            **/*.markdown
            **/*.MD
            **/*.log
            import-test.php
            import-shops-web.php
            extract_target_list.py
            requirements-extract.txt
            requirements-extract*.txt
            shops.csv
            wp_shops.example.json
            .cursorrules
            .cursor/**
            **/.env
            **/.env.*
            **/*.secret
            **/*.pem
            dashboard/app/**
            dashboard/lib/**
            dashboard/components/**
            dashboard/public/**
            dashboard/.next/**
            dashboard/out/**
            dashboard/next.config.ts
            dashboard/tsconfig.json
            dashboard/postcss.config.mjs
            dashboard/eslint.config.mjs
            dashboard/package.json
            dashboard/package-lock.json
            dashboard/next-env.d.ts
            dashboard/README.md
            dashboard/CLAUDE.md
            dashboard/AGENTS.md
            dashboard/.gitignore

      - name: Post-deploy REST check
        env:
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
        run: |
          sleep 5
          HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
            -X POST "${WP_SITE_URL}/wp-json/escomi/v1/update" \
            -H "Content-Type: application/json" \
            --max-time 20)
          echo "::notice::デプロイ後 REST check: POST /wp-json/escomi/v1/update → HTTP ${HTTP_CODE}"
          if [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "403" ]; then
            echo "REST ルート保護確認 OK（HTTP ${HTTP_CODE}）— 認証なし更新は拒否されています"
            exit 0
          fi
          echo "::error::REST ルート保護確認 NG（HTTP ${HTTP_CODE}）— 401 または 403 が必要です"
          exit 1
